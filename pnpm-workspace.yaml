allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# First-party packages are exempt from the dependency maturity gate, by scope
# rather than by version.
#
# The gate exists so that a compromised third-party release is not picked up in
# the window before anyone notices. A package this organization published from
# its own CI is not that risk, and the release flow depends on a consumer
# pinning a version minutes after it is published.
#
# This repository sets no maturity gate of its own, and does not need one for
# the exemption to matter. Dependabot supplies a three-day constraint on the
# command line when it resolves, so its runs meet a gate whether or not
# anything here asks for one. Without this exemption the first run after a
# first-party release fails outright and names a package unrelated to the one
# being bumped, which reads as a broken release rather than as a configuration
# gap.
#
# The failure needs an exact pin, which is what this repository uses for the
# kit: pnpm falls back to the newest mature version within a declared range,
# and an exact pin has no range to walk back through, so it fails instead of
# stepping back.
#
# A scope glob rather than named versions. Naming versions means editing this
# file on every release, which is the kind of maintenance that stops happening.
minimumReleaseAgeExclude:
  - "@withmarfa/*"
