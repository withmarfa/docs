# Build integrity guard. The production build runs a full prerender, so a
# broken internal link, a malformed MDX page, or a type error all fail the
# build — not just spec changes. Running build + type-check on every PR and
# every push to main stops a red build from reaching main and the deploy.
#
# The job keeps its name after gaining a test step: the branch ruleset requires
# this exact context string, and renaming the job silently drops the gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and type-check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Ephemeral runners need the pnpm cache because their store does not
          # survive between jobs. Self-hosted runners retain their local store,
          # so caching it only adds archive work. Set CI_RUNNER to self-hosted
          # to disable the cache when routing work back to the local pool.
          cache: ${{ vars.CI_RUNNER != 'self-hosted' && 'pnpm' || '' }}

      - run: pnpm install --frozen-lockfile
      # Build before type-check: vite build generates src/routeTree.gen.ts
      # (gitignored), which tsc needs to resolve the route types. It also runs
      # the full prerender, so link and MDX breaks fail here.
      - run: pnpm build
      - run: pnpm types:check
      - run: pnpm snippets:check
      # The publish guard's classification. It otherwise only runs unattended
      # once a day, which is how its first version shipped with a retry loop
      # that could not retry.
      - run: bash .github/scripts/read-live-commit.test.sh

      # Protocol conformance for the MCP endpoint. These assert against the
      # specification rather than against whatever the current clients tolerate,
      # which is the gap that let four defects ship unnoticed.
      - run: pnpm test
