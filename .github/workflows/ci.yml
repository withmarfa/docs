# Build integrity guard. The production build runs a full prerender, so a
# broken internal link, a malformed MDX page, or a type error all fail the
# build — not just spec changes. Building every change that anything the build
# reads could be part of, on every PR and every push to main, stops a red build
# from reaching main and the deploy. Agent instructions and the root readme are
# the exception: nothing builds from them.
#
# The job keeps its name after gaining a test step: the branch ruleset requires
# this exact context string, and renaming the job silently drops the gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A manual run that can choose where it runs, without touching where every
  # other run goes.
  #
  # This repository routes to a hosted provider by default and that is
  # deliberate: its jobs are short and Linux-friendly, so the self-hosted macOS
  # pool would be the slower choice. The input exists so one run can be pointed
  # at that pool when there is a reason to, without changing routing for
  # anybody else pushing at the same time.
  #
  # Blank is the ordinary case and resolves exactly as before, so this is
  # invisible to anything that does not pass it.
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner label for this run only. Blank uses the repository's
          normal routing.
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs, and answers whether anything the build reads changed. The
  # build is a required check, so the workflow carries no `paths` filter: a
  # filtered-out workflow would leave the check pending, where a job skipped by
  # `if:` satisfies it. Everything uncertain answers true, and a push after a
  # commit with no green run of this workflow always builds. The script
  # and its test explain the rules.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/ci-changes.sh

  build:
    name: Build and type-check
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    timeout-minutes: 15
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Ephemeral runners need the pnpm cache because their store does not
          # survive between jobs. Self-hosted runners retain their local store,
          # so caching it only adds archive work. Set CI_RUNNER to self-hosted
          # to disable the cache when routing work back to the local pool.
          cache: ${{ vars.CI_RUNNER != 'self-hosted' && 'pnpm' || '' }}

      - run: pnpm install --frozen-lockfile
      # Build before type-check: vite build generates the route tree
      # (gitignored), which tsc needs to resolve the route types. It also runs
      # the full prerender, so link and MDX breaks fail here.
      - run: pnpm build
      # The status page is a second build target with its own route tree, and
      # its own tsc project — the two trees register route paths into one
      # global interface, so compiled together they merge and the losing side's
      # loader types silently become `undefined`. Both trees have to exist
      # before the type check, and each is checked against only its own.
      - run: pnpm build:status
      - run: pnpm types:check
      # The publish guard's classification. It otherwise only runs unattended
      # once a day, which is how its first version shipped with a retry loop
      # that could not retry.
      - run: bash .github/scripts/read-live-commit.test.sh
      # And the notifier's own judgment: which failure is a statement about the
      # site, which is about the checkout, and which is no statement at all.
      # Also that the two publish paths keep separate alert keys — one key
      # across both means a green publish of either silently resolves an open
      # alert about the other.
      - run: bash .github/scripts/post-alert.test.sh
      # And whether the checker is still writing at all — the one failure the
      # status page cannot show, because a frozen store renders as a healthy
      # site. A guard that silently stopped working would reproduce exactly the
      # failure it was written to close, so its classification is exercised
      # here rather than only unattended once a day.
      - run: bash .github/scripts/check-store-freshness.test.sh
      # Which changes skip this job, so a wrong skip cannot ship quietly.
      - run: bash .github/scripts/ci-changes.test.sh
      # What the sync script writes from the spec, and that every spec it
      # refuses leaves the committed files as they were.
      - run: bash .github/scripts/sync-from-marfa.test.sh

      # Protocol conformance for the MCP endpoint. These assert against the
      # specification rather than against whatever the current clients tolerate,
      # which is the gap that let four defects ship unnoticed.
      - run: pnpm test
