# Build integrity guard. The production build runs a full prerender, so a
# broken internal link, a malformed MDX page, or a type error all fail the
# build — not just spec changes. Running build + type-check on every PR and
# every push to main stops a red build from reaching main and the deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and type-check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No `cache: pnpm`. On the self-hosted pool the store at
          # ~/Library/pnpm/store already persists between jobs, so the cache
          # restores nothing — but its post step still tars the whole store,
          # and that store is 12 GB. Several jobs finishing together put
          # concurrent multi-gigabyte tars on one machine, which is what made
          # runs take about an hour with every visible step green. Restore
          # this if the repository moves back to hosted runners, where the
          # store does not survive between jobs and the cache does pay.

      - run: pnpm install --frozen-lockfile
      # Build before type-check: vite build generates src/routeTree.gen.ts
      # (gitignored), which tsc needs to resolve the route types. It also runs
      # the full prerender, so link and MDX breaks fail here.
      - run: pnpm build
      - run: pnpm types:check
