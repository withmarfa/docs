# Build integrity guard. The production build runs a full prerender, so a
# broken internal link, a malformed MDX page, or a type error all fail the
# build — not just spec changes. Building every change that anything the build
# reads could be part of, on every PR and every push to main, stops a red build
# from reaching main and the deploy. Agent instructions and the root readme are
# the exception: nothing builds from them.
#
# `Full CI` is the one required check, a roll-up of the jobs below. Renaming
# `Build and type-check` therefore no longer drops the gate, but renaming the
# roll-up job would.
name: CI

on:
  push:
    branches: [main]
  # Marking a draft ready runs the workflow again, so `Full CI` is reported.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  # A push to `main` or a manual run gets a group of its own, so a later push
  # never cancels the verdict on a commit; only a pull request's run is
  # superseded. A draft and a ready pull request have groups of their own: a
  # draft pushed and marked ready a moment later starts two runs, and in one
  # group the later queued run cancels the other, which can leave `Full CI`
  # unreported.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.event.pull_request.draft && 'draft' || 'ready') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Always runs, and answers whether anything the build reads changed. The
  # build is a required check, so the workflow carries no `paths` filter: a
  # filtered-out workflow would leave the check pending, where a job skipped by
  # `if:` satisfies it. Everything uncertain answers true, and a push after a
  # commit with no green run of this workflow always builds. The script
  # and its test explain the rules.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      sync: ${{ steps.classify.outputs.sync }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/ci-changes.sh

  build:
    name: Build and type-check
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    timeout-minutes: 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Build before type-check: vite build generates the route tree
      # (gitignored), which tsc needs to resolve the route types. It also runs
      # the full prerender, so link and MDX breaks fail here.
      - run: pnpm build
      # The status page is a second build target with its own route tree, and
      # its own tsc project — the two trees register route paths into one
      # global interface, so compiled together they merge and the losing side's
      # loader types silently become `undefined`. Both trees have to exist
      # before the type check, and each is checked against only its own.
      - run: pnpm build:status
      - run: pnpm types:check
      # The publish guard's classification. It otherwise only runs by hand,
      # which is how its first version shipped with a retry loop
      # that could not retry.
      - run: bash .github/scripts/read-live-commit.test.sh
      # And whether the checker is still writing at all — the one failure the
      # status page cannot show, because a frozen store renders as a healthy
      # site. A guard that silently stopped working would reproduce exactly the
      # failure it was written to close, so its classification is exercised
      # here rather than only by hand.
      - run: bash .github/scripts/check-store-freshness.test.sh
      # Which changes skip this job, so a wrong skip cannot ship quietly.
      - run: bash .github/scripts/ci-changes.test.sh
      # What the sync script writes from the spec, and that every spec it
      # refuses leaves the committed files as they were. Its fixtures read
      # nothing else in the tree, so it runs only when the script, the test or
      # this workflow changed.
      - if: ${{ needs.changes.outputs.sync != 'false' }}
        run: bash .github/scripts/sync-from-marfa.test.sh

      # Protocol conformance for the MCP endpoint. These assert against the
      # specification rather than against whatever the current clients tolerate,
      # which is the gap that let four defects ship unnoticed.
      - run: pnpm test

  # A report on a pull request that reads the change and never blocks it. It
  # sits in a job of its own, not in the required build, so a bug in it cannot
  # turn the required check red, and the workflow still carries no `paths`
  # filter: the step decides whether a report is due. It needs no
  # dependencies, so nothing is installed.
  reports:
    name: Docs reports
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 3
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Which hand-written pages cite a rule or an operation that this change
      # altered or removed. A list to read, never a request to write: a page it
      # names may need no change (STYLE.md, "Keeping pages current").
      - name: Staleness report
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          base="$(git merge-base "$BASE" "$HEAD")"
          if git diff --quiet "$base" "$HEAD" -- openapi.json src/generated/contract-index.json; then
            echo "Neither openapi.json nor the contract index changed, so there is no staleness report."
            exit 0
          fi
          node --experimental-strip-types scripts/staleness-report.ts "$base" "$HEAD" | tee -a "$GITHUB_STEP_SUMMARY"

  # The one required check, in the same shape as the other WithMarfa
  # repositories. A skipped job satisfies a required check, and `Build and
  # type-check` is skipped for a change nothing builds from, so this job turns
  # the result of the others into one verdict. On a draft it is named `Draft
  # CI`, so the required `Full CI` stays expected, which blocks a merge, until
  # the run that marking the pull request ready starts has finished. It runs
  # after a failed job and fails then; a cancelled run skips it, and a skipped
  # job never reports as `Full CI`, so a cancel cannot leave it green.
  gate:
    name: ${{ github.event.pull_request.draft && 'Draft CI' || 'Full CI' }}
    needs: [changes, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "::error::A job failed or was cancelled: ${RESULTS}"
              exit 1
              ;;
          esac
