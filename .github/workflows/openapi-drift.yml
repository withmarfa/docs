# Freshness guard for the committed API spec.
#
# `openapi.json` is generated in the server monorepo and pushed here by an
# automated cross-repo sync. Two things can still leave the published API
# reference wrong: a hand-edit in this repo, or a sync that silently stopped
# running. This job catches both by comparing the committed file against the
# monorepo's canonical copy.
#
# The comparison needs read access to a second repository, which the built-in
# GITHUB_TOKEN cannot grant. Provide a fine-grained token as the
# `SPEC_SOURCE_TOKEN` repo secret (repository access: the server monorepo;
# permission: `Contents: read`) to turn the comparison on.
#
# A missing secret is a failure on the canonical repository and a skip
# anywhere else. Skipping everywhere is what this job used to do, and it is
# how the guard spent its whole life inert: no secret was ever provisioned, so
# every run printed a warning nobody reads and exited zero. A check that
# passes when it cannot run is worse than no check, because the green tick
# reports coverage that does not exist. A fork still cannot be blocked by a
# credential it has no way to hold.
name: OpenAPI drift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SPEC_SOURCE_REPO: withmarfa/marfa
  # The repository the comparison is mandatory on. Anywhere else — a fork, a
  # self-hoster's copy — cannot hold the credential, so it skips instead.
  SPEC_CANONICAL_REPO: withmarfa/docs

jobs:
  drift:
    name: OpenAPI spec freshness
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Catches a truncated or shell-contaminated sync before it reaches the
      # generated reference, whether or not the cross-repo check can run.
      - name: Validate the committed spec
        run: |
          python3 - <<'PY'
          import json, sys

          spec = json.load(open('openapi.json'))
          version = spec.get('openapi', '')
          if not version.startswith('3.'):
              sys.exit(f'openapi.json declares openapi: {version!r}, expected 3.x')
          if not spec.get('paths'):
              sys.exit('openapi.json declares no paths')
          print(f'openapi {version}, {len(spec["paths"])} paths')
          PY

      - name: Compare against the monorepo spec
        env:
          GH_TOKEN: ${{ secrets.SPEC_SOURCE_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            if [ "${GITHUB_REPOSITORY}" = "${SPEC_CANONICAL_REPO}" ]; then
              echo "::error title=Drift guard cannot run::SPEC_SOURCE_TOKEN is not set on ${GITHUB_REPOSITORY}, so openapi.json was never compared against ${SPEC_SOURCE_REPO}. Provision a fine-grained token (repository access: ${SPEC_SOURCE_REPO}; permission: Contents: read) as the SPEC_SOURCE_TOKEN repo secret. Failing rather than passing: a guard that cannot run must not report green."
              exit 1
            fi
            echo "::warning title=Cross-repo check skipped::SPEC_SOURCE_TOKEN is not set on ${GITHUB_REPOSITORY}, which is not ${SPEC_CANONICAL_REPO}, so only local validation ran."
            exit 0
          fi
          gh api \
            -H "Accept: application/vnd.github.raw" \
            "repos/${SPEC_SOURCE_REPO}/contents/openapi.json" > /tmp/upstream-openapi.json
          if cmp -s /tmp/upstream-openapi.json openapi.json; then
            echo "openapi.json matches ${SPEC_SOURCE_REPO}."
            exit 0
          fi
          echo "::error title=openapi.json is stale::The committed spec differs from ${SPEC_SOURCE_REPO}. Run ./scripts/sync-openapi.sh and commit the result."
          python3 - <<'PY'
          import json

          upstream = json.load(open('/tmp/upstream-openapi.json'))
          committed = json.load(open('openapi.json'))
          up, com = set(upstream.get('paths', {})), set(committed.get('paths', {}))
          for label, paths in (('missing here', up - com), ('no longer upstream', com - up)):
              for path in sorted(paths):
                  print(f'{label}: {path}')
          if up == com:
              print('path sets match; the difference is inside one or more operations')
          PY
          exit 1
