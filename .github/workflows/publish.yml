# Publishing the docs site, and proving it happened.
#
# Merging here used to change nothing a reader sees: the deploy was `pnpm
# deploy` from somebody's shell, and nothing reported that nobody had run it.
# The site sat six merges behind, was cleared by hand, and was fifteen behind
# again within a day. Both halves of that are silent, so both are closed here.
# A merge publishes, and a site that has fallen behind says so.
#
# The comparison itself lives in `.github/scripts/read-live-commit.sh` and is
# covered by the test beside it, so it can be run on demand rather than only
# unattended.
#
# Hosted runners on purpose. A deploy job holds a credential, and a job whose
# point is reporting that something broke cannot run on the machine whose
# failure it is meant to report.
name: Publish

on:
  # Triggered by CI succeeding rather than by the push itself, so a commit that
  # fails type-check, snippet or protocol tests is never published. The two
  # would otherwise race and the deploy could win.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Catches a publish that stopped working for a reason no merge would show:
  # an expired token, a revoked permission, a deploy that reported success and
  # did not take.
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [check, publish]
        default: check

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Cloudflare
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
    runs-on: ubuntu-latest
    # The proof loop alone can take ten attempts at twenty seconds plus fifteen
    # between them, so the budget has to clear that with room for a cold
    # install and a full prerender. Too tight and the job dies before the step
    # that writes the annotation explaining why.
    timeout-minutes: 25
    outputs:
      published: ${{ steps.target.outputs.publish }}
      # What the notifier needs to name a finding rather than restate a job
      # conclusion. `expected` is written before the first step that can
      # refuse, and `live` and `verdict` immediately before the proof gives up,
      # so a failed job still carries all three.
      expected: ${{ steps.target.outputs.expected }}
      live: ${{ steps.proof.outputs.live }}
      verdict: ${{ steps.proof.outputs.verdict }}
    env:
      # One expression, used for the checkout, the build stamp and the proof, so
      # the three cannot disagree. On a workflow_run event `github.sha` is the
      # default branch head rather than the commit CI passed on, which is how a
      # re-run of an older CI run would have deployed old content while stamping
      # current main, silently rolling the site back behind a green check.
      DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Needed to prove the commit being deployed is main's tip.
          fetch-depth: 0

      # Whether this run should publish at all. The decision lives in
      # `check_deploy_target`, in the shell helper, because a `run:` block
      # cannot be exercised by a test: an earlier version of this guard could
      # be inverted so it deployed only when the commit was *not* main's tip,
      # and a full green test run said nothing.
      - name: Decide whether to publish
        id: target
        run: |
          source .github/scripts/read-live-commit.sh
          git fetch --quiet origin main || true
          TIP="$(resolve_main_ref)"
          # Written before anything can refuse, so a publish that fails at any
          # later step still tells the notifier which commit should be live.
          # Only when it really is a sha: `resolve_main_ref` hands back the
          # literal ref name on a checkout without origin/main, and an alert
          # reading "main is origin/main" is a fabricated finding rather than
          # an absent one.
          case "$TIP" in
            *[!0-9a-f]*|"") ;;
            *) echo "expected=$TIP" >> "$GITHUB_OUTPUT" ;;
          esac
          set +e
          check_deploy_target "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$DEPLOY_COMMIT" "$TIP"
          verdict=$?
          set -e
          case "$verdict" in
            0) echo "publish=yes" >> "$GITHUB_OUTPUT" ;;
            2) echo "publish=no"  >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      # Fails rather than skips when the credential is absent. A deploy step
      # that quietly does nothing is the defect this workflow removes, and a
      # guard that passes when it cannot run is worse than no guard because it
      # reports green.
      - name: Require the deploy credential
        if: steps.target.outputs.publish == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error title=No account pinned::The CLOUDFLARE_ACCOUNT_ID repository variable is not set. Without it wrangler picks the account from the token, and a token reaching more than one fails on account selection with an error that reads nothing like its cause."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error title=No deploy credential::CLOUDFLARE_API_TOKEN is not set on this repository, so this commit has not been published and the live site is now behind main."
            echo "It wants an account-owned token scoped to:"
            echo "  Account, Workers Scripts, Edit"
            echo "  Zone, Workers Routes, Edit, on the zone carrying the docs custom domain"
            echo "  Zone, Zone, Read, on the same zone"
            echo "A broader token is not a shortcut. One that reaches more than one account makes"
            echo "wrangler fail on account selection, with an error reading nothing like the cause."
            echo "Until it exists, publishing is 'pnpm build && pnpm exec wrangler deploy' from an authenticated shell."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        if: steps.target.outputs.publish == 'yes'
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        if: steps.target.outputs.publish == 'yes'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.target.outputs.publish == 'yes'

      # `pnpm deploy` is pnpm's own command for something unrelated, so the
      # build and the wrangler call run separately rather than through the
      # package script.
      - name: Build
        if: steps.target.outputs.publish == 'yes'
        env:
          MARFA_BUILD_COMMIT: ${{ env.DEPLOY_COMMIT }}
        run: pnpm build

      - name: Deploy
        if: steps.target.outputs.publish == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      # A deploy that returns zero is not proof that readers are served the new
      # bundle. Ask the site what it is running.
      - name: Prove the live site is serving this commit
        id: proof
        if: steps.target.outputs.publish == 'yes'
        run: |
          source .github/scripts/read-live-commit.sh
          for attempt in $(seq 1 10); do
            LIVE="$(read_live_commit)"
            if [ "$LIVE" = "$DEPLOY_COMMIT" ]; then
              echo "Live site is serving ${LIVE}."
              { echo "live=$LIVE"; echo "verdict=current"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt ${attempt}: live site reports ${LIVE}, expected ${DEPLOY_COMMIT}."
            if [ "$attempt" -lt 10 ]; then sleep 15; fi
          done
          # Written before the failure rather than after it. A step that exits
          # non-zero still publishes what it put in GITHUB_OUTPUT, but only what
          # it got there first, and this is the difference between an alert
          # naming the commit the site is stuck on and one saying merely that
          # something failed.
          {
            echo "live=$LIVE"
            echo "verdict=$(describe_live_state "$DEPLOY_COMMIT" "$LIVE")"
          } >> "$GITHUB_OUTPUT"
          echo "::error title=Deploy did not take::wrangler reported success, but the live version endpoint still reports ${LIVE} rather than ${DEPLOY_COMMIT}."
          exit 1

  check:
    name: Is the live site current
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'check')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      live: ${{ steps.compare.outputs.live }}
      expected: ${{ steps.compare.outputs.expected }}
      verdict: ${{ steps.compare.outputs.verdict }}
    env:
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. The value of this job is naming which commits are
          # unpublished, and on the default shallow checkout only the tip
          # resolves, so every real comparison would fall through to
          # "unknown-commit" and send the reader after a phantom.
          fetch-depth: 0

      - name: Compare the live commit against main
        id: compare
        run: |
          source .github/scripts/read-live-commit.sh
          # Tolerant on purpose. Resolving this inline killed the step under
          # `bash -e` on a checkout with no origin/main, before the classifier
          # could return the verdict written for exactly that case.
          git fetch --quiet origin main || true
          EXPECTED="$(resolve_main_ref)"

          # Retried, unlike a one-shot read, because a single DNS or edge blip
          # at 07:23 would otherwise open an alert against a healthy site.
          for attempt in 1 2 3; do
            LIVE="$(read_live_commit)"
            case "$LIVE" in
              unreachable|unreadable) ;;
              *) break ;;
            esac
            echo "Attempt ${attempt}: ${LIVE}."
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done

          # The verdict and both commits, written before `report_live_state`
          # returns non-zero. Setting them after it would mean the one alert
          # that matters is the one arriving with nothing in it.
          {
            echo "live=$LIVE"
            echo "verdict=$(describe_live_state "$EXPECTED" "$LIVE")"
            # Only when the comparison ref resolved to a sha. `resolve_main_ref`
            # returns the literal ref name when it does not, and reporting that
            # as main invents a finding where the checkout is what is at fault.
            case "$EXPECTED" in
              *[!0-9a-f]*|"") ;;
              *) echo "expected=$EXPECTED" ;;
            esac
          } >> "$GITHUB_OUTPUT"

          report_live_state "$EXPECTED" "$LIVE"

  notify:
    # Reports to the configured alert destination. Unlike the estate's other
    # notifiers this also fires on a publish failure, because a merge that
    # failed to publish is precisely the silent case this workflow exists for
    # and nobody is watching the run.
    # The key is stable, so a repeated failure holds one alert open rather than
    # opening a new one per merge.
    #
    # Skipped entirely when neither job ran. `workflow_run` fires on every CI
    # conclusion, so a failed or cancelled CI run on main reaches here with both
    # jobs skipped; alerting on that would open an alert titled for a publishing
    # fault whose real cause is a red CI run that already has its own signal and
    # its own required check.
    #
    # A publish run that deliberately deployed nothing — main moved on, and the
    # run carrying the newer commit publishes it — reports nothing either. It
    # succeeded without reaching readers, and posting `resolved` for that would
    # clear a genuine open alert on the strength of a run that published
    # nothing.
    needs: [publish, check]
    # Skipped when no alert destination is configured, so a fork sends nothing.
    if: >-
      always()
      && (needs.publish.result != 'skipped' || needs.check.result != 'skipped')
      && needs.publish.outputs.published != 'no'
      && vars.ALERT_WEBHOOK_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report outcome
        env:
          ALERT_URL: ${{ vars.ALERT_WEBHOOK_URL }}
          ALERT_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
          RESULTS: ${{ join(needs.*.result, ',') }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          SITE_URL: ${{ vars.DOCS_SITE_URL }}
          # The finding itself. Whichever of the two jobs ran holds it; the
          # other is skipped and contributes empty strings.
          PUBLISH_LIVE: ${{ needs.publish.outputs.live }}
          PUBLISH_EXPECTED: ${{ needs.publish.outputs.expected }}
          PUBLISH_VERDICT: ${{ needs.publish.outputs.verdict }}
          CHECK_LIVE: ${{ needs.check.outputs.live }}
          CHECK_EXPECTED: ${{ needs.check.outputs.expected }}
          CHECK_VERDICT: ${{ needs.check.outputs.verdict }}
        run: |
          # `needs.*.result` only ever holds success, failure, cancelled or
          # skipped; a job hitting `timeout-minutes` reports failure, so there
          # is no `timed_out` arm to write.
          #
          # Cancellation exits without reporting, matching the conformance
          # suite rather than the drift guard. The drift guard treats a cancel
          # as an alert because it runs on the self-hosted pool and a run that
          # never gets picked up is how a dead pool presents. These jobs are
          # hosted, so a cancel here is GitHub dropping a queued run when
          # several merges land together, and alerting on it would open
          # "did not complete" on an ordinary busy morning.
          LIVE="${PUBLISH_LIVE:-$CHECK_LIVE}"
          EXPECTED="${PUBLISH_EXPECTED:-$CHECK_EXPECTED}"
          VERDICT="${PUBLISH_VERDICT:-$CHECK_VERDICT}"

          # The title carries the commits themselves. Seven characters is what a
          # reader compares against a git log; the fields carry them in full.
          short() { printf '%s' "${1:0:7}"; }

          case ",$RESULTS," in
            *,failure,*)
              STATE=open
              if [ "$VERDICT" = unknown-ref ]; then
                # A statement about the checkout rather than about the site, so
                # it changes subject to the check in the same way the did-not-run
                # case does. Naming a verdict here would be the confidently-wrong
                # diagnostic the guard itself refuses to make.
                TITLE="Docs publish check: inconclusive"
              elif printf '%s' "$LIVE" | grep -Eq '^[0-9a-f]{7,40}$' &&
                   printf '%s' "$EXPECTED" | grep -Eq '^[0-9a-f]{7,40}$'; then
                TITLE="Docs site: serving $(short "$LIVE"), main is $(short "$EXPECTED")"
              elif [ -n "$VERDICT" ]; then
                # The site answered with something that is not a commit:
                # unreachable, unreadable, missing, or built from a dirty tree.
                TITLE="Docs site: $VERDICT"
              elif [ -n "$EXPECTED" ]; then
                # It failed before it ever got to read the site.
                TITLE="Docs site: not publishing $(short "$EXPECTED")"
              else
                TITLE="Docs publish check: inconclusive"
              fi ;;
            *,cancelled,*) echo "Run cancelled; nothing to report."; exit 0 ;;
            *,success,*)   STATE=resolved; TITLE="Docs site: current" ;;
            # Neither job reached a verdict. `inconclusive` rather than
            # `skipped`, which implies a decision and would make a guard that
            # silently stopped running read as routine.
            *)             STATE=open;     TITLE="Docs publish check: inconclusive" ;;
          esac
          # The destination may or may not need a credential, so the header is
          # built rather than hardcoded: an empty token would otherwise be sent
          # as "Bearer " with nothing after it, which reads as a malformed
          # request rather than an unauthenticated one.
          AUTH=()
          if [ -n "${ALERT_TOKEN:-}" ]; then
            AUTH=(-H "Authorization: Bearer $ALERT_TOKEN")
          fi
          # `github.workflow` is the workflow's *display name*, not its
          # filename, and this key is what pairs an open alert with the resolve
          # that later clears it. Renaming this workflow's `name:` therefore
          # re-keys every alert from it: the open one can never be resolved, and
          # the next failure opens a second alongside it. Downstream filtering
          # keys on the same string and breaks silently.
          #
          # This key deliberately covers both the publish outcome and the daily
          # freshness check. On a publish failure that means two messages, one
          # from here and one from the central delivery reporting, which is an
          # accepted duplicate: splitting the key is more machinery than a
          # second message about a real failure costs.
          #
          # Links live in field values as Markdown and never in the title, so a
          # destination rendering the title as plain text shows prose rather
          # than bracket syntax.
          # Built into a variable and checked before anything is posted,
          # rather than piped straight into curl. A pipeline exits with the
          # status of its last command, so a jq that writes nothing leaves
          # curl posting an empty body to a destination that accepts it, and
          # the step goes green having sent no alert. `set -o pipefail` is the
          # usual answer and it is not enough here: it makes the pipeline red
          # but cannot tell a body that failed to build from a POST that
          # failed to land, and those two want opposite handling.
          BODY="$(
            jq -n --arg t "$TITLE" --arg s "$STATE" --arg k "github/$REPO/$WORKFLOW" \
                  --arg u "$RUN_URL" --arg r "$REPO" --arg w "$WORKFLOW" --arg j "$RESULTS" \
                  --arg ru "$REPO_URL" --arg rn "$RUN_NUMBER" --arg site "$SITE_URL" \
                  --arg live "$LIVE" --arg main "$EXPECTED" --arg verdict "$VERDICT" \
              '{source:"github",severity:"warning",title:$t,state:$s,key:$k,link:$u,
                fields:(
                  {Repository:"[\($r)](\($ru))",Workflow:$w,Run:"[#\($rn)](\($u))",Jobs:$j}
                  + (if $site == "" then {} else {Site:"[docs site](\($site))"} end)
                  + (if $live == "" then {} else {Live:$live} end)
                  + (if $main == "" then {} else {Main:$main} end)
                  + (if $verdict == "" then {} else {Verdict:$verdict} end))}'
          )" || {
            echo "::error::The alert body could not be built. Nothing was sent."
            exit 1
          }
          if [ -z "$BODY" ]; then
            echo "::error::The alert body came out empty. Nothing was sent."
            exit 1
          fi

          printf '%s' "$BODY" \
          | curl -sS --fail-with-body --max-time 20 -X POST "$ALERT_URL" \
              "${AUTH[@]}" \
              -H "Content-Type: application/json" --data @-
          # No `|| true`. The estate's other notifiers swallow a failed POST,
          # which is defensible where the workflow is a required context and its
          # red run is the signal. This one gates nothing, so a swallowed POST
          # would leave no signal anywhere, which is the original defect
          # reproduced inside the thing built to prevent it.
