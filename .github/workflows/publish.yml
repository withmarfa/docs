# Publishing, and proving it happened.
#
# Two Workers ship from this repository: the documentation site, and the status
# page that watches it. They deploy independently and are proved independently,
# because a page reporting on the docs site must not go down with it. Each has
# its own job, its own checkout, its own version endpoint and its own alert key.
#
# Separate checkouts are not tidiness. The deploy pointer the Vite plugin writes
# is one fixed path per project root and every build rewrites it, so building
# both targets and then deploying in one tree deploys whichever built last.
#
# Merging here used to change nothing a reader sees: the deploy was `pnpm
# deploy` from somebody's shell, and nothing reported that nobody had run it.
# The site sat six merges behind, was cleared by hand, and was fifteen behind
# again within a day. Both halves of that are silent, so both are closed here.
# A merge publishes, and a site that has fallen behind says so.
#
# The comparison itself lives in `.github/scripts/read-live-commit.sh` and is
# covered by the test beside it, so it can be run on demand rather than only
# unattended.
#
# Hosted runners on purpose. A deploy job holds a credential, and a job whose
# point is reporting that something broke cannot run on the machine whose
# failure it is meant to report.
name: Publish

on:
  # Triggered by CI succeeding rather than by the push itself, so a commit that
  # fails type-check, snippet or protocol tests is never published. The two
  # would otherwise race and the deploy could win.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Catches a publish that stopped working for a reason no merge would show:
  # an expired token, a revoked permission, a deploy that reported success and
  # did not take.
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [check, publish]
        default: check
      # The release valve for the coupling two targets in one repository
      # creates. Both are gated on the same CI run, so without this a red docs
      # suite would block a fix to the one page whose job is to be reachable
      # while something is broken.
      target:
        description: Which site
        type: choice
        options: [both, docs, status]
        default: both

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the docs site
    # `inputs.target` is empty on every event but a dispatch, so both targets
    # run unless a dispatch deliberately narrows it.
    if: >-
      inputs.target != 'status'
      && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
      )
    runs-on: ubuntu-latest
    # The proof loop alone can take ten attempts at twenty seconds plus fifteen
    # between them, so the budget has to clear that with room for a cold
    # install and a full prerender. Too tight and the job dies before the step
    # that writes the annotation explaining why.
    timeout-minutes: 25
    outputs:
      published: ${{ steps.target.outputs.publish }}
      # What the notifier needs to name a finding rather than restate a job
      # conclusion. `expected` is written before the first step that can
      # refuse, and `live` and `verdict` immediately before the proof gives up,
      # so a failed job still carries all three.
      expected: ${{ steps.target.outputs.expected }}
      live: ${{ steps.proof.outputs.live }}
      verdict: ${{ steps.proof.outputs.verdict }}
    env:
      # One expression, used for the checkout, the build stamp and the proof, so
      # the three cannot disagree. On a workflow_run event `github.sha` is the
      # default branch head rather than the commit CI passed on, which is how a
      # re-run of an older CI run would have deployed old content while stamping
      # current main, silently rolling the site back behind a green check.
      DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Needed to prove the commit being deployed is main's tip.
          fetch-depth: 0

      # Whether this run should publish at all. The decision lives in
      # `check_deploy_target`, in the shell helper, because a `run:` block
      # cannot be exercised by a test: an earlier version of this guard could
      # be inverted so it deployed only when the commit was *not* main's tip,
      # and a full green test run said nothing.
      - name: Decide whether to publish
        id: target
        env:
          PUBLISH_TARGET: docs
        run: |
          source .github/scripts/read-live-commit.sh
          git fetch --quiet origin main || true
          TIP="$(resolve_main_ref)"
          # Written before anything can refuse, so a publish that fails at any
          # later step still tells the notifier which commit should be live.
          # Only when it really is a sha: `resolve_main_ref` hands back the
          # literal ref name on a checkout without origin/main, and an alert
          # reading "main is origin/main" is a fabricated finding rather than
          # an absent one.
          case "$TIP" in
            *[!0-9a-f]*|"") ;;
            *) echo "expected=$TIP" >> "$GITHUB_OUTPUT" ;;
          esac
          set +e
          check_deploy_target "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$DEPLOY_COMMIT" "$TIP"
          verdict=$?
          set -e
          case "$verdict" in
            0) ;;
            2) echo "publish=no" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *) exit 1 ;;
          esac

          # This commit is main's tip. Whether this target needs republishing is
          # a second question, and the trigger cannot answer it: a
          # workflow_run event supports no path filters and carries no
          # changed-file list. So diff against what the site is actually
          # serving, which this workflow already knows how to read.
          #
          # Every uncertain case publishes. A wasted deploy costs a minute; a
          # skipped one leaves a stale site behind a green run, which is the
          # exact failure this workflow exists to close.
          LIVE="$(read_live_commit)"
          case "$LIVE" in
            *[!0-9a-f]*|"")
              echo "The live site reports '${LIVE}', which is not a commit, so there is nothing to diff against. Publishing."
              echo "publish=yes" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if ! git cat-file -e "${LIVE}^{commit}" 2>/dev/null; then
            echo "The live site reports ${LIVE}, which is not in this history. Publishing."
            echo "publish=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if git diff --name-only "$LIVE" "$DEPLOY_COMMIT" | paths_touch_target "$PUBLISH_TARGET"; then
            echo "Publishing: something the ${PUBLISH_TARGET} target builds from changed since ${LIVE}."
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Not publishing: nothing the ${PUBLISH_TARGET} target builds from changed between ${LIVE} and ${DEPLOY_COMMIT}."
            echo "publish=no" >> "$GITHUB_OUTPUT"
          fi

      # Fails rather than skips when the credential is absent. A deploy step
      # that quietly does nothing is the defect this workflow removes, and a
      # guard that passes when it cannot run is worse than no guard because it
      # reports green.
      - name: Require the deploy credential
        if: steps.target.outputs.publish == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error title=No account pinned::The CLOUDFLARE_ACCOUNT_ID repository variable is not set. Without it wrangler picks the account from the token, and a token reaching more than one fails on account selection with an error that reads nothing like its cause."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error title=No deploy credential::CLOUDFLARE_API_TOKEN is not set on this repository, so this commit has not been published and the live site is now behind main."
            echo "It wants an account-owned token scoped to:"
            echo "  Account, Workers Scripts, Edit"
            echo "  Zone, Workers Routes, Edit, on the zone carrying the docs custom domain"
            echo "  Zone, Zone, Read, on the same zone"
            echo "A broader token is not a shortcut. One that reaches more than one account makes"
            echo "wrangler fail on account selection, with an error reading nothing like the cause."
            echo "Until it exists, publishing is 'pnpm build && pnpm exec wrangler deploy' from an authenticated shell."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        if: steps.target.outputs.publish == 'yes'
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        if: steps.target.outputs.publish == 'yes'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.target.outputs.publish == 'yes'

      # `pnpm deploy` is pnpm's own command for something unrelated, so the
      # build and the wrangler call run separately rather than through the
      # package script.
      - name: Build
        if: steps.target.outputs.publish == 'yes'
        env:
          MARFA_BUILD_COMMIT: ${{ env.DEPLOY_COMMIT }}
        run: pnpm build

      - name: Deploy
        if: steps.target.outputs.publish == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      # A deploy that returns zero is not proof that readers are served the new
      # bundle. Ask the site what it is running.
      - name: Prove the live site is serving this commit
        id: proof
        if: steps.target.outputs.publish == 'yes'
        run: |
          source .github/scripts/read-live-commit.sh
          for attempt in $(seq 1 10); do
            LIVE="$(read_live_commit)"
            if [ "$LIVE" = "$DEPLOY_COMMIT" ]; then
              echo "Live site is serving ${LIVE}."
              { echo "live=$LIVE"; echo "verdict=current"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt ${attempt}: live site reports ${LIVE}, expected ${DEPLOY_COMMIT}."
            if [ "$attempt" -lt 10 ]; then sleep 15; fi
          done
          # Written before the failure rather than after it. A step that exits
          # non-zero still publishes what it put in GITHUB_OUTPUT, but only what
          # it got there first, and this is the difference between an alert
          # naming the commit the site is stuck on and one saying merely that
          # something failed.
          {
            echo "live=$LIVE"
            echo "verdict=$(describe_live_state "$DEPLOY_COMMIT" "$LIVE")"
          } >> "$GITHUB_OUTPUT"
          echo "::error title=Deploy did not take::wrangler reported success, but the live version endpoint still reports ${LIVE} rather than ${DEPLOY_COMMIT}."
          exit 1

  check:
    name: Is the docs site current
    if: >-
      inputs.target != 'status'
      && (
        github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.mode == 'check')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      live: ${{ steps.compare.outputs.live }}
      expected: ${{ steps.compare.outputs.expected }}
      verdict: ${{ steps.compare.outputs.verdict }}
    env:
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. The value of this job is naming which commits are
          # unpublished, and on the default shallow checkout only the tip
          # resolves, so every real comparison would fall through to
          # "unknown-commit" and send the reader after a phantom.
          fetch-depth: 0

      - name: Compare the live commit against main
        id: compare
        run: |
          source .github/scripts/read-live-commit.sh
          # Tolerant on purpose. Resolving this inline killed the step under
          # `bash -e` on a checkout with no origin/main, before the classifier
          # could return the verdict written for exactly that case.
          git fetch --quiet origin main || true
          EXPECTED="$(resolve_main_ref)"

          # Retried, unlike a one-shot read, because a single DNS or edge blip
          # at 07:23 would otherwise open an alert against a healthy site.
          for attempt in 1 2 3; do
            LIVE="$(read_live_commit)"
            case "$LIVE" in
              unreachable|unreadable) ;;
              *) break ;;
            esac
            echo "Attempt ${attempt}: ${LIVE}."
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done

          # The verdict and both commits, written before `report_live_state`
          # returns non-zero. Setting them after it would mean the one alert
          # that matters is the one arriving with nothing in it.
          {
            echo "live=$LIVE"
            echo "verdict=$(describe_live_state "$EXPECTED" "$LIVE")"
            # Only when the comparison ref resolved to a sha. `resolve_main_ref`
            # returns the literal ref name when it does not, and reporting that
            # as main invents a finding where the checkout is what is at fault.
            case "$EXPECTED" in
              *[!0-9a-f]*|"") ;;
              *) echo "expected=$EXPECTED" ;;
            esac
          } >> "$GITHUB_OUTPUT"

          report_live_state "$EXPECTED" "$LIVE"

  publish-status:
    name: Publish the status page
    if: >-
      inputs.target != 'docs'
      && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      published: ${{ steps.target.outputs.publish }}
      expected: ${{ steps.target.outputs.expected }}
      live: ${{ steps.proof.outputs.live }}
      verdict: ${{ steps.proof.outputs.verdict }}
    env:
      DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The guard's URL builder reads DOCS_SITE_URL, so pointing it here is how
      # this job proves its own deploy against its own site rather than both
      # jobs interrogating the docs site and one of them always agreeing.
      DOCS_SITE_URL: ${{ vars.STATUS_SITE_URL || 'https://status.marfa.so' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Decide whether to publish
        id: target
        env:
          PUBLISH_TARGET: status
        run: |
          source .github/scripts/read-live-commit.sh
          git fetch --quiet origin main || true
          TIP="$(resolve_main_ref)"
          case "$TIP" in
            *[!0-9a-f]*|"") ;;
            *) echo "expected=$TIP" >> "$GITHUB_OUTPUT" ;;
          esac
          set +e
          check_deploy_target "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$DEPLOY_COMMIT" "$TIP"
          verdict=$?
          set -e
          case "$verdict" in
            0) ;;
            2) echo "publish=no" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *) exit 1 ;;
          esac

          # Which target a merge concerns, decided against what this site is
          # actually serving. Uncertainty publishes: this page shares the docs
          # site's stylesheet, its shared constants and its lockfile, so the
          # cost of guessing wrong in the other direction is a status page
          # quietly reporting from a bundle nobody shipped.
          LIVE="$(read_live_commit)"
          case "$LIVE" in
            *[!0-9a-f]*|"")
              echo "The status page reports '${LIVE}', which is not a commit, so there is nothing to diff against. Publishing."
              echo "publish=yes" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if ! git cat-file -e "${LIVE}^{commit}" 2>/dev/null; then
            echo "The status page reports ${LIVE}, which is not in this history. Publishing."
            echo "publish=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if git diff --name-only "$LIVE" "$DEPLOY_COMMIT" | paths_touch_target "$PUBLISH_TARGET"; then
            echo "Publishing: something the ${PUBLISH_TARGET} target builds from changed since ${LIVE}."
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Not publishing: nothing the ${PUBLISH_TARGET} target builds from changed between ${LIVE} and ${DEPLOY_COMMIT}."
            echo "publish=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the deploy credential
        if: steps.target.outputs.publish == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error title=No account pinned::The CLOUDFLARE_ACCOUNT_ID repository variable is not set. Without it wrangler picks the account from the token, and a token reaching more than one fails on account selection with an error that reads nothing like its cause."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error title=No deploy credential::CLOUDFLARE_API_TOKEN is not set on this repository, so this commit has not been published and the status page is now behind main."
            echo "It wants the same scopes the docs deploy needs, on the account holding both Workers."
            echo "Until it exists, publishing is 'pnpm run deploy:status' from an authenticated shell."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        if: steps.target.outputs.publish == 'yes'
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        if: steps.target.outputs.publish == 'yes'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.target.outputs.publish == 'yes'

      - name: Build
        if: steps.target.outputs.publish == 'yes'
        env:
          MARFA_BUILD_COMMIT: ${{ env.DEPLOY_COMMIT }}
        run: pnpm run build:status

      # Deployed through the config this build emitted, never a bare `wrangler
      # deploy`. A bare call resolves through the pointer file the Vite plugin
      # writes, which is one fixed path per project root: in a tree where the
      # docs target had also been built, it would deploy the docs Worker under
      # this job's name and report success.
      - name: Deploy
        if: steps.target.outputs.publish == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy -c dist-status/server/wrangler.json

      - name: Prove the status page is serving this commit
        id: proof
        if: steps.target.outputs.publish == 'yes'
        run: |
          source .github/scripts/read-live-commit.sh
          for attempt in $(seq 1 10); do
            LIVE="$(read_live_commit)"
            if [ "$LIVE" = "$DEPLOY_COMMIT" ]; then
              echo "Status page is serving ${LIVE}."
              { echo "live=$LIVE"; echo "verdict=current"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt ${attempt}: status page reports ${LIVE}, expected ${DEPLOY_COMMIT}."
            if [ "$attempt" -lt 10 ]; then sleep 15; fi
          done
          {
            echo "live=$LIVE"
            echo "verdict=$(describe_live_state "$DEPLOY_COMMIT" "$LIVE")"
          } >> "$GITHUB_OUTPUT"
          echo "::error title=Deploy did not take::wrangler reported success, but the status page still reports ${LIVE} rather than ${DEPLOY_COMMIT}."
          exit 1

  check-status:
    name: Is the status page current
    # Without this twin, a status page that stopped publishing rots invisibly,
    # which is the exact failure the docs half of this workflow exists to close.
    if: >-
      inputs.target != 'docs'
      && (
        github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.mode == 'check')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      live: ${{ steps.compare.outputs.live }}
      expected: ${{ steps.compare.outputs.expected }}
      verdict: ${{ steps.compare.outputs.verdict }}
    env:
      DOCS_SITE_URL: ${{ vars.STATUS_SITE_URL || 'https://status.marfa.so' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare the live commit against main
        id: compare
        run: |
          source .github/scripts/read-live-commit.sh
          git fetch --quiet origin main || true
          EXPECTED="$(resolve_main_ref)"

          for attempt in 1 2 3; do
            LIVE="$(read_live_commit)"
            case "$LIVE" in
              unreachable|unreadable) ;;
              *) break ;;
            esac
            echo "Attempt ${attempt}: ${LIVE}."
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done

          {
            echo "live=$LIVE"
            echo "verdict=$(describe_live_state "$EXPECTED" "$LIVE")"
            case "$EXPECTED" in
              *[!0-9a-f]*|"") ;;
              *) echo "expected=$EXPECTED" ;;
            esac
          } >> "$GITHUB_OUTPUT"

          report_live_state "$EXPECTED" "$LIVE"

  # Two notifiers, because the key is what pairs an open alert with the resolve
  # that later clears it. Under one key, a green docs publish would post
  # `resolved` against an alert an open status-publish failure is holding, and
  # silently clear a real finding about the other site.
  #
  # The docs key is unchanged. Re-keying it would orphan any alert currently
  # open: it could never be resolved, and the next failure would open a second
  # one beside it.
  #
  # Both call the same script. Ninety lines of shell duplicated per target
  # would have drifted the first time either was fixed, and the decisions in it
  # are covered by `post-alert.test.sh`.
  notify:
    needs: [publish, check]
    if: >-
      always()
      && (needs.publish.result != 'skipped' || needs.check.result != 'skipped')
      && needs.publish.outputs.published != 'no'
      && vars.ALERT_WEBHOOK_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Report outcome
        env:
          SUBJECT: Docs site
          CHECK_SUBJECT: Docs publish check
          SITE_LABEL: docs site
          # `github.workflow` is the workflow's display name, not its filename.
          # Renaming this workflow's `name:` re-keys every alert from it.
          ALERT_KEY: github/${{ github.repository }}/${{ github.workflow }}
          ALERT_URL: ${{ vars.ALERT_WEBHOOK_URL }}
          ALERT_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
          RESULTS: ${{ join(needs.*.result, ',') }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          SITE_URL: ${{ vars.DOCS_SITE_URL }}
          # Whichever of the two jobs ran holds the finding; the other is
          # skipped and contributes empty strings.
          LIVE: ${{ needs.publish.outputs.live || needs.check.outputs.live }}
          EXPECTED: ${{ needs.publish.outputs.expected || needs.check.outputs.expected }}
          VERDICT: ${{ needs.publish.outputs.verdict || needs.check.outputs.verdict }}
        run: bash .github/scripts/post-alert.sh

  notify-status:
    needs: [publish-status, check-status]
    if: >-
      always()
      && (needs.publish-status.result != 'skipped' || needs.check-status.result != 'skipped')
      && needs.publish-status.outputs.published != 'no'
      && vars.ALERT_WEBHOOK_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Report outcome
        env:
          SUBJECT: Status page
          CHECK_SUBJECT: Status publish check
          SITE_LABEL: status page
          ALERT_KEY: github/${{ github.repository }}/${{ github.workflow }}/status
          ALERT_URL: ${{ vars.ALERT_WEBHOOK_URL }}
          ALERT_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
          RESULTS: ${{ join(needs.*.result, ',') }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          SITE_URL: ${{ vars.STATUS_SITE_URL }}
          LIVE: ${{ needs.publish-status.outputs.live || needs.check-status.outputs.live }}
          EXPECTED: ${{ needs.publish-status.outputs.expected || needs.check-status.outputs.expected }}
          VERDICT: ${{ needs.publish-status.outputs.verdict || needs.check-status.outputs.verdict }}
        run: bash .github/scripts/post-alert.sh
