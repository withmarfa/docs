# Shape check for the committed API spec.
#
# `openapi.json` is generated in the server monorepo and copied here by
# `scripts/sync-from-marfa.sh`. This job checks only that what landed is a
# usable OpenAPI document: a sync that truncated the file, or shell output that
# contaminated it, would otherwise reach the published reference and break it
# silently.
#
# Nothing checks that the file is the *current* spec. The monorepo's drift
# check and its automated sync were removed, so run the sync script after an
# API change lands there.
name: OpenAPI spec

# Not a required check, so the trigger may filter by path: the job reads
# `openapi.json` and nothing else.
on:
  push:
    branches: [main]
    paths: [openapi.json, .github/workflows/openapi-validate.yml]
  pull_request:
    branches: [main]
    paths: [openapi.json, .github/workflows/openapi-validate.yml]
  workflow_dispatch:

concurrency:
  # A push to `main` or a manual run gets a group of its own, so a later push
  # never cancels the verdict on a commit; only a pull request's run is
  # superseded.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate the committed spec
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate the committed spec
        run: |
          python3 - <<'PY'
          import json, sys

          spec = json.load(open('openapi.json'))
          version = spec.get('openapi', '')
          if not version.startswith('3.'):
              sys.exit(f'openapi.json declares openapi: {version!r}, expected 3.x')
          if not spec.get('paths'):
              sys.exit('openapi.json declares no paths')
          print(f'openapi {version}, {len(spec["paths"])} paths')
          PY
