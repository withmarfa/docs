# Shape check for the committed API spec.
#
# `openapi.json` is generated in the server monorepo and copied here by
# `scripts/sync-from-marfa.sh`. This job checks only that what landed is a
# usable OpenAPI document: a sync that truncated the file, or shell output that
# contaminated it, would otherwise reach the published reference and break it
# silently.
#
# Nothing checks that the file is the *current* spec. The monorepo's drift
# check and its automated sync were removed, so run the sync script after an
# API change lands there.
name: OpenAPI spec

# Not a required check, so the trigger may filter by path: the job reads
# `openapi.json` and nothing else.
on:
  push:
    branches: [main]
    paths: [openapi.json, .github/workflows/openapi-validate.yml]
  pull_request:
    branches: [main]
    paths: [openapi.json, .github/workflows/openapi-validate.yml]
  # A manual run that can choose where it runs, without touching where every
  # other run goes.
  #
  # This repository routes to a hosted provider by default and that is
  # deliberate: its jobs are short and Linux-friendly, so the self-hosted macOS
  # pool would be the slower choice. The input exists so one run can be pointed
  # at that pool when there is a reason to, without changing routing for
  # anybody else pushing at the same time.
  #
  # Blank is the ordinary case and resolves exactly as before, so this is
  # invisible to anything that does not pass it.
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner label for this run only. Blank uses the repository's
          normal routing.
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate the committed spec
    timeout-minutes: 10
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate the committed spec
        run: |
          python3 - <<'PY'
          import json, sys

          spec = json.load(open('openapi.json'))
          version = spec.get('openapi', '')
          if not version.startswith('3.'):
              sys.exit(f'openapi.json declares openapi: {version!r}, expected 3.x')
          if not spec.get('paths'):
              sys.exit('openapi.json declares no paths')
          print(f'openapi {version}, {len(spec["paths"])} paths')
          PY
