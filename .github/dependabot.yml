version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # TanStack Start pins the exact Router version it was built with, so the
      # two must move in one pull request. A group matches in the order listed.
      tanstack:
        patterns:
          - "@tanstack/*"
      all-npm:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
